<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#054625">
    <meta name="description" content="Restaurants et épicerie africaine livrés chez vous">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="namke">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>namke</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..72,600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #root {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh; /* hauteur visible réelle sur mobile (barre d'adresse exclue) */
            display: flex;
            flex-direction: column;
            margin: 0 auto;
            background: #FCFBF5;
            box-shadow: 0 0 40px rgba(5,16,4,0.12);
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #E9E4C9;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Styles pour les icônes @expo/vector-icons sur le web */
        svg {
            display: inline-block;
            vertical-align: middle;
        }
        /* Sur téléphone : plein écran, sans cadre */
        @media (max-width: 480px) {
            #root { box-shadow: none; }
            html, body { background: #FCFBF5; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <!-- En dev : masque l'erreur connue des extensions navigateur (message channel closed) -->
    <script>
      (function () {
        if (typeof window === 'undefined') return;
        window.addEventListener('unhandledrejection', function (e) {
          var msg = (e.reason && (e.reason.message || String(e.reason))) || '';
          if (msg.indexOf('message channel closed') !== -1) {
            e.preventDefault();
            e.stopPropagation();
          }
        });
      })();
    </script>
    <script>
      // PWA : le service worker ne tourne qu'en HTTPS (pas sur le serveur de dev)
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
</body>
</html>
